# macfand - Fan Control daemon for Apple Computers running Linux
# Configuration File
#

config:
{
    # Profiles Directory
    profileDir = "/usr/local/macfand/machines";
    
    # Model Identifier
    modelID = "macpro1,1";

    # Configuration values
    # uncomment if using generic or wish to tweak settings

    #temp_avg_floor - What is considered normal temp (avg of all sensors)
    #temp_avg_floor = 45;

    #temp_avg_ceiling - What is considered hot (sets full fan speed) (avg of all sensors)
    #temp_avg_ceiling = 55;

    #blacklist - Sensors to ignore
    #blacklist = ("TC0P", "TM0P");

    #fan_ctrl - Sets which sensors should control each fan
    #This is an array of elements, such as:
    #fan_ctrl = (
    #    {
    #       # fan 1 - follows the HOTTEST of fan_sensors. Besides SMC keys,
    #       # any hwmon sensor can be named as "<hwmon name>:<temp label>"
    #       # (see /sys/class/hwmon/*/name and temp*_label), e.g.
    #       # "coretemp:Package id 0" or "amdgpu:junction". T2 Macs need this:
    #       # their SMC has no usable CPU die / GPU junction sensor.
    #       fan_sensors = ("TC0P", "TM0P", "TM8P");
    #       floor = 45;
    #       ceiling = 55;
    #       min_speed = 1500;
    #       max_speed = 6200;
    #    },
    #    {
    #       # fan 2
    #       use_avg = true; # use all available sensors average to determine fan speed
    #       floor = 45;
    #       ceiling = 55;
    #       min_speed = 1500;
    #       max_speed = 6200;
    #    }, ...
    #);

    #rampdown_deadband / rampdown_step - Smoothing (RPM). Speed-ups always
    #apply immediately; slow-downs smaller than the deadband are ignored and
    #larger ones are limited to rampdown_step per poll (0 = unlimited).
    #rampdown_deadband = 100;
    #rampdown_step = 250;

    #log_level - Logging Verbosity
    #  0 - startup/exit logging only
    #  1 - basic temp / fan logging
    #  2 - log all sensors
    #
    log_level = 1;
}
